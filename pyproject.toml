[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-service"
version = "0.2.0"
description = "RAG ingestion, retrieval, generation, evaluation, and frozen regression gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Homayoun Safarpour", email = "homayoun.safarpour@gmail.com" }]
keywords = [
    "rag",
    "evaluation",
    "fastapi",
    "retrieval",
    "llm-evaluation",
    "ci-gate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.24",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/homayoun-safarpour/rag-eval-service"
Repository = "https://github.com/homayoun-safarpour/rag-eval-service"
Issues = "https://github.com/homayoun-safarpour/rag-eval-service/issues"

[project.scripts]
rag-eval = "rag_eval_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
