name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Dogfood frozen retrieval gate
        run: >-
          rag-eval check
          --corpus examples/corpus.json
          --cases examples/cases.json
          --baseline examples/baseline_v1.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start API and persistent vector store
        run: docker compose up --build --detach --wait
      - name: Verify non-root API image
        run: test "$(docker compose exec -T api id -u)" = "10001"
      - name: Exercise ingestion, persistence, retrieval, generation, and judge
        run: python scripts/container_smoke.py
      - name: Print service logs
        if: always()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down --volumes
